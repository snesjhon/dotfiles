# ============================================================
# tmux plugin manifest. Only `set -g @plugin` declarations belong here -- settings live in plugins/<name>.conf, sourced after the declarations (mirrors vim's plugins.vim). Key bindings live in mappings.conf.
# ============================================================

# Theme plugin (must be loaded first for visual consistency)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'fabioluciano/tmux-powerkit'

# --- per-plugin config, one file per plugin (like vim/plugins/*.vim) ---
source-file "$HOME/Developer/dotfiles/tmux/plugins/*.conf"
