set -g @plugin 'tmux-plugins/tpm'

set -g @plugin 'vaaleyard/tmux-dotbar'
set -g @tmux-dotbar-right true
set -g @tmux-dotbar-status-right-text "%I:%M %p 󰥔 "
set -g @tmux-dotbar-bold-current-window true

# 🌑 DARK MODE CONFIGURATION
if-shell "defaults read -g AppleInterfaceStyle &>/dev/null" {
    set -g @tmux-dotbar-bg "#28262B"           # Dark background
    set -g @tmux-dotbar-fg "#707280"           # Soft gray for inactive windows
    set -g @tmux-dotbar-fg-current "#e3e3e6"   # Light slate for active window text
    set -g @tmux-dotbar-fg-session "#e3e3e6"   # Light text for session name
    set -g @tmux-dotbar-fg-prefix "#a48cf2"    # Bright vibrant purple accent when prefix key is pressed
}

# ☀️ LIGHT MODE CONFIGURATION (Your Original Theme)
if-shell "! defaults read -g AppleInterfaceStyle &>/dev/null" {
    set -g @tmux-dotbar-bg "#fafaff"           # Crisp white background (or "default" for transparent)
    set -g @tmux-dotbar-fg "#8c8d99"           # Soft gray for inactive windows
    set -g @tmux-dotbar-fg-current "#2e2e38"   # Dark slate for active window text
    set -g @tmux-dotbar-fg-session "#2e2e38"   # Subtle GitLab soft blue for session name
    set -g @tmux-dotbar-fg-prefix "#6b4fbb"    # Deep muted purple accent when prefix key is pressed
}

set -g @tmux-dotbar-session-text "  #S "        # Icon + Session name (requires Nerd Fonts)

