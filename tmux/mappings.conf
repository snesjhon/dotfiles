# --- prefix key (see tmux.conf for the `set -g prefix` itself) ---
unbind C-b
bind C-a send-prefix

# Reload tmux configuration file
unbind r
bind r source-file ~/.tmux.conf

# Zen mode specific to tmux. On `g` rather than `z`, which is tmux's own
# zoom toggle (resize-pane -Z). The unbind is needed because re-sourcing this
# file doesn't drop the old `Z` binding from an already-running server.
unbind Z
bind g run-shell "$HOME/Developer/dotfiles/tmux/tmux-zen.sh toggle #{pane_id}"

# Split panes with intuitive keys
bind - split-window -h
unbind '"'
unbind %

# Smart pane navigation (works from both nvim and plain terminal)
# If the active pane is running nvim, send the key to nvim; otherwise do tmux pane switch
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
bind -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'

# Prefix-based pane navigation (fallback)
bind -r h select-pane -L
bind -r l select-pane -R
bind -r j select-pane -D
bind -r k select-pane -U

# Navigate windows with prefix+p/n (previous/next)
unbind ,
unbind .
bind -n C-S-, previous-window
bind -n C-S-. next-window

# Close current pane. Routed through tmux-zen.sh so that in zen mode, closing
# the centered pane takes the two margins with it instead of leaving them
# behind as panes you'd have to kill separately.
bind -n C-M-S-q run-shell "$HOME/Developer/dotfiles/tmux/tmux-zen.sh kill #{pane_id}"

# new window
bind -n C-M-S-n new-window -a -c "#{pane_current_path}"

# split window
bind -n C-S-M-p split-window -h

# ===========================
# COPY MODE CONFIGURATION
# ===========================

# Vi-style text selection and copying
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-pipe "pbcopy"

# Pane navigation in copy mode (C-h/C-j default to cursor-left/copy-pipe-and-cancel in copy-mode-vi, override them)
bind-key -T copy-mode-vi C-h select-pane -L
bind-key -T copy-mode-vi C-l select-pane -R
bind-key -T copy-mode-vi C-j select-pane -D
bind-key -T copy-mode-vi C-k select-pane -U

# Exit copy mode with 'a' key (in addition to default 'q')
bind-key -T copy-mode-vi 'a' send -X cancel

# ===========================
# SPECIAL KEY BINDINGS
# ===========================

# FZF integration - unbind conflicting keys
unbind -T copy-mode C-r
unbind -T prefix C-r

# Pass through C-r to shell for fzf history search
bind-key -n 'C-r' send-keys 'C-r'

# Ctrl+F: fzf popup that types the pick back into the current pane as a relative path (no
# Enter). Passes through to nvim untouched, since Ctrl-F is nvim's own page-down there.
bind-key -n C-f if-shell "$is_vim" 'send-keys C-f' 'run-shell "$HOME/Developer/dotfiles/tmux/fzf-insert-picker.sh #{pane_id}"'

# Pass through Shift+Enter for Claude Code multi-line input
bind-key -n S-Enter send-keys Escape "[13;2u"

# With extended-keys on, Ctrl-Space arrives as a CSI u sequence instead of the raw NUL
# byte nvim reads as <C-Space> (see nvim/lua/lsp.lua), so send the NUL byte explicitly.
bind-key -n C-Space send-keys -H 00

# Yazi and lazygit, each in a throwaway window that closes when the program exits.
# Deliberately NOT display-popup: yazi probes the terminal for cell size / image support
# and tmux popups don't proxy those replies back, so it dies with a "Terminal response
# timeout" (yazi-rs.github.io/docs/faq#trt). A real pane answers the queries fine.
# No editor detection needed -- nvim has its own <F6> (YaziChooser) and <leader>gg.
bind-key -n C-S-y new-window -c "#{pane_current_path}" -n yazi yazi
bind-key -n C-S-n new-window -c "#{pane_current_path}" -n lazygit lazygit

# Floating scratch terminal (see tmux-popup.sh) -- persistent session, toggled open/closed
bind-key -n C-S-t run-shell "$HOME/Developer/dotfiles/tmux/tmux-popup.sh"

bind-key -n C-S-o if-shell -F '#{m:claude-*,#{session_name}}' \
  'detach-client' \
  'run-shell "$HOME/.tmux/plugins/tmux-claude-session-manager/scripts/launch.sh \"#{q:pane_current_path}\" \"#{window_id}\""'
bind-key -n C-S-p run-shell "$HOME/.tmux/plugins/tmux-claude-session-manager/scripts/list.sh '#{client_name}'"

# Smart copy-mode toggle (works with nvim and tmux)
bind-key -n 'C-\' if-shell "ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'" 'send-keys C-\\ C-n' 'copy-mode'
