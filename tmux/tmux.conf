# ===========================
# TERMINAL & DISPLAY SETTINGS
# ===========================
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:Tc"

# Pass through styled/colored underlines (undercurl) so nvim's squiggly LSP
# diagnostic highlights render instead of being silently dropped by tmux's
# default terminfo.
set -as terminal-features ',*:usstyle'

# Remove delay for exiting insert mode with ESC in Neovim
set -sg escape-time 0

# Status line position
set -g status-position bottom

# Renumber windows when they're closed
set-option -g renumber-windows on

# Color scheme for selection mode
set -g mode-style bg=blue,fg=lightgray

# yazi config
# "all" (not just "on") since tmux only treats "on" panes as passthrough-eligible when visible,
# and a display-popup pane doesn't count as visible -- yazi's background-color detection query
# never reaches the real terminal there, so it falls back to its dark flavor.
set -g allow-passthrough all
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# taken from sesh, but like it
set -g detach-on-destroy off  # don't exit from tmux when closing a session

set -g focus-events on

# ===========================
# INPUT & INTERACTION SETTINGS
# ===========================

# Enable mouse support
set -g mouse on

# Enable extended keys support in tmux
set -s extended-keys on

# Tell tmux that the terminal supports extended keys
set -as terminal-features 'tmux-256color:extkeys'

# Use vi-style key bindings in copy mode
set-window-option -g mode-keys vi

# ===========================
# PREFIX KEY CONFIGURATION
# ===========================

# Change prefix key from C-b to C-a (see mappings.conf for the unbind/rebind)
set -g prefix C-a

# ===========================
# WINDOW & PANE NUMBERING
# ===========================

# Start session, window, and pane numbering at 1 instead of 0
set -g base-index 1
setw -g pane-base-index 1

# --- plugin declarations + per-plugin config (see plugins.conf, plugins/*.conf) ---
source-file "$HOME/Developer/dotfiles/tmux/plugins.conf"

# --- all key bindings (see mappings.conf) ---
source-file "$HOME/Developer/dotfiles/tmux/mappings.conf"

run '~/.tmux/plugins/tpm/tpm'
