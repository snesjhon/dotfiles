"$schema" = 'https://starship.rs/config-schema.json'

format = """
$directory\
$git_branch\
$git_status\
$custom\
$all\
"""

[git_branch]
format = '[$symbol$branch(:$remote_branch)]($style)[$worktree]($style) '

[gradle]
disabled = true

[kotlin]
disabled = true

[java]
format = "[$symbol($version )]($style)"

[nodejs]
format = "[$symbol($version )]($style)"

[custom.ignition_base]
command = "GIT_PR_BASE_SKIP_GH=1 $HOME/Developer/dotfiles/scripts/git-pr-base.sh 2>/dev/null"
when = '''
git remote get-url origin 2>/dev/null | grep -q "ignition.git" || exit 1
base="$(GIT_PR_BASE_SKIP_GH=1 "$HOME/Developer/dotfiles/scripts/git-pr-base.sh" 2>/dev/null)"
[ -z "$base" ] && exit 1
default=""
for remote in upstream origin; do
  ref=$(git symbolic-ref --short "refs/remotes/${remote}/HEAD" 2>/dev/null)
  [ -n "$ref" ] && { default="${ref#${remote}/}"; break; }
done
[ -z "$default" ] && default="main"
[ "${base#*/}" != "$default" ]
'''
symbol = "⑂ "
style = "bold yellow"
format = '[$symbol\($output\)]($style) '

[cmd_duration]
disabled = true
