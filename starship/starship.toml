"$schema" = 'https://starship.rs/config-schema.json'

format = """
$directory\
$git_branch\
$git_status\
$custom\
$all\
"""

[git_branch]
format = '[$symbol$branch(:$remote_branch)]($style)[$worktree]($style) '

[gradle]
disabled = true

[kotlin]
disabled = true

[java]
format = "[$symbol($version )]($style)"

[nodejs]
format = "[$symbol($version )]($style)"

[cmd_duration]
disabled = true
