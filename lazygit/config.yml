# PR review via vimdiff. Universal `openDiffTool` (<ctrl+t>) already shells out to
# `git difftool --no-prompt`, so `git config --global diff.tool vimdiff` (see os/install.sh)
# is enough to make that native binding open real vimdiff splits for whatever lazygit is
# currently diffing. The customCommand below adds a one-key shortcut in the Files panel
# that skips lazygit's own diffing-mode setup and vimdiffs the selected file straight
# against the PR's resolved base branch, reusing the same git-pr-base.sh gp()/:PrFiles/:PrReview share.
customCommands:
  - key: 'V'
    context: 'files'
    description: 'Vimdiff selected file against PR base'
    command: >-
      git difftool --no-prompt -t vimdiff "$(${GIT_PR_BASE_SCRIPT:-$HOME/Developer/dotfiles/scripts/git-pr-base.sh})...HEAD" -- "{{.SelectedFile.Name}}"
    output: terminal
